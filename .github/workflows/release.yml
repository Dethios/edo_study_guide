name: Compile and Release PDF

on:
  push:
    tags:
      - 'release-*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull LaTeX Docker Image
        run: docker pull texlive/texlive:latest

      - name: Compile PDF
        run: ./scripts/docker-build.sh tex/main.tex

      - name: Prepare Release Asset
        run: |
          date_str=$(date +%Y-%m-%d)
          RELEASE_FILE="EDO_Study_Guide_dtd_${date_str}.pdf"
          cp artifacts/out/main.pdf "$RELEASE_FILE"
          echo "RELEASE_FILE=$RELEASE_FILE" >> $GITHUB_ENV
          
          # Determine tag name
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="release-$(date +%Y%m%d)"
          fi
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

      - name: Push Tag if Manual Run
        if: github.ref_type != 'tag'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            git tag "$TAG_NAME"
            git push origin "$TAG_NAME"
          fi

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$RELEASE_FILE" --clobber
          else
            gh release create "$TAG_NAME" "$RELEASE_FILE" \
              --title "$TAG_NAME" \
              --notes "Automated release of the EDO Study Guide compiled on $(date +%Y-%m-%d)."
          fi
