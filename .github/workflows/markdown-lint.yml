name: Markdown Lint

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.md'
      - '.rumdl.toml'
      - '.github/workflows/markdown-lint.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.md'
      - '.rumdl.toml'
      - '.github/workflows/markdown-lint.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install rumdl
        run: ~/.local/bin/uv tool install rumdl

      - name: Run rumdl check
        run: |
          ~/.local/bin/rumdl check AGENTS.md README.md CHANGELOG.md
          ~/.local/bin/rumdl check docs/
