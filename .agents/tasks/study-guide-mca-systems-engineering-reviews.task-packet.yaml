requesting_mode: implement
normalized_goal: Integrate source-checked Navy MCA systems-engineering review content into the EDO study guide in the correct context, without adding short-answer prompts or flashcards.
scope: projects/edo_study_guide content and project documentation only. Keep the canonical review lifecycle in tex/chapters/17I_CM_and_Technical_Reviews.tex, update adjacent chapters only for concise cross-context alignment, and do not touch unrelated workspace root drift.
relevant_context:
  - The user provided detailed content covering ASR, SRR, SFR, PDR, CDR, TRR, SVR/FCA, PRR, PCA, and IBR for Navy MCA programs.
  - The user explicitly said not to add short-answer prompts and not to add flashcards.
  - The content must be scoped as a study-guide update, inserted in the correct context, and deduplicated against existing material.
  - The study-guide AGENTS.md requires current primary-source checks for doctrine, sentence-level \autocite{} citations, \ac{} acronym usage in prose, longtblr for tables, and Docker validation through ./scripts/docker-build.sh tex/main.tex.
  - The submodule is currently dirty in tex/chapters/17G_Systems_Engineering_Overview.tex, tex/chapters/17I_CM_and_Technical_Reviews.tex, tex/chapters/17K_jcids.tex, and tex/chapters/18B_test-eval.tex; preserve user-owned work and merge with it rather than reverting.
  - tex/chapters/17I_CM_and_Technical_Reviews.tex already contains an MCA Technical Reviews by Phase table. Expand and update it rather than creating a duplicate lifecycle table or a new chapter.
  - tex/chapters/14_EVM.tex already contains an Integrated Baseline Review subsection. FAR 34.202 should be the primary IBR anchor if adding policy detail.
  - tex/acronyms.def already defines asr, srr, sfr, pdr, cdr, trr, svr, otrr, prr, fca, pca, ibr, evms, pmb, dote, optevfor, and supship. Do not add duplicate acronym keys.
  - README.me does not exist; the applicable file is projects/edo_study_guide/README.md.
  - "Current planning source anchors checked: DoDI 5000.88 section 3.5, FAR 34.202, DAU Technical Reviews and Audits, and the DoD Systems Engineering Guidebook February 2022 section 3."
