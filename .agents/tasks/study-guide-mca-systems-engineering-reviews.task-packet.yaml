constraints:
  - Do not add short-answer prompts.
  - Do not add flashcards.
  - Do not duplicate content that already exists; update the existing 17I lifecycle content where possible.
  - Keep IBR framed as a management-baseline realism review, not a systems-engineering design review.
  - Use current official or primary sources for policy-sensitive claims before editing.
  - Prefer DoDI 5000.88 for system-level technical-review requirements and FAR 34.202 for IBR requirements.
  - Keep cross-chapter updates concise; do not scatter a full review matrix across multiple chapters.
  - Use existing acronym keys and avoid acronym macros in headings and table headers if the surrounding file does not already require them.
  - Use \autocite{} inside sentences before punctuation for new sourced claims.
  - Preserve existing dirty changes and do not revert unrelated user work.
  - Keep generated build artifacts and PDFs out of Git.
  - Update CHANGELOG.md for the content update.
  - Update README.md and AGENTS.md only if the implementation reveals a concrete appropriate change; otherwise report that no update was needed.
deliverables:
  - Expanded or revised 17I technical-review section covering lifecycle, baseline maturity, required reviews, Navy participants/authorities, common traps, and concise review-by-review details.
  - FAR-grounded update to 14_EVM.tex IBR content if current text lacks the needed management-baseline contrast.
  - Minimal cross-references or clarifications in milestones, systems engineering, JCIDS, T&E, and key-role appendix only where needed.
  - Bibliography updates for FAR 34.202 and DAU or official source entries if missing, plus refreshed source metadata where verified.
  - Acronym verification with no duplicate acronym keys.
  - CHANGELOG.md Unreleased entry.
  - README.md and AGENTS.md updates only if appropriate.
  - Validation report with commands, exit status, and any residual warnings or blockers.
validation_requirements:
  - Run git -C projects/edo_study_guide status --short --branch before editing and before final response.
  - Run git -C projects/edo_study_guide diff --check after edits.
  - Run rg to confirm no short-answer or flashcard sections were added to the technical-review chapter.
  - Run rg checks for DoDI5000-88, FAR 34.202 citation keys, SE Guidebook, DAU source entries, and any stale Title 10 or DoDI 5000.89/5000.98 references touched by the change.
  - Run ./scripts/docker-build.sh tex/main.tex from projects/edo_study_guide after edits.
  - If Docker build is unavailable, run ./scripts/build.sh tex/main.tex if local LaTeX is available, otherwise report the exact blocker and provide partial validation from diff/source checks.
  - After a build attempt, run rg "undefined citation|Citation .* undefined|Reference .* undefined|Missing character|Overfull \\\\hbox|TODO" tex artifacts/build from projects/edo_study_guide and distinguish pre-existing warnings from new issues.
