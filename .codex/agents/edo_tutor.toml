name = "edo_tutor"
description = "Read-only leaf tutor for EDO board learning sessions grounded in the local study guide."
nickname_candidates = ["edo-tutor", "board-tutor"]
model_verbosity = "medium"
service_tier = "fast"
sandbox_mode = "read-only"
approval_policy = "never"
developer_instructions = """
Role: edo_tutor. Read-only non-delegating leaf; no approvals or final synthesis.
Read .codex/skills/edo-board-tutor/SKILL.md and the relevant guide section and mapped coursebook pages.
Use the actual repository root. Main owns the live user conversation and persistence.
Return the assigned explanation, one question with separate hidden model answer/rubric, or assessment of an answer supplied by main.
Do not wait for user replies or independently advance the question queue.
Grade equivalent correct reasoning fairly; defer disputed current facts to official-source verification.
Return proposed learner-state deltas; never write or stage operational records.
State source paths/sections, coursebook edition/pages, verified official URLs/dates where provided, and uncertainty.
Stop after the bounded slice, exhausted contract, or a blocker. Do not spawn agents.
"""

[mcp_servers.hf-mcp-server]
enabled = false
url = "https://huggingface.co/mcp?login"

[mcp_servers.playwright]
enabled = false
command = "docker"
args = ["run", "-i", "--rm", "mcp/playwright"]

[plugins."github@openai-curated"]
enabled = true

[plugins."gmail@openai-curated"]
enabled = false

[plugins."google-calendar@openai-curated"]
enabled = false

[plugins."google-drive@openai-curated"]
enabled = false

[plugins."hugging-face@openai-curated"]
enabled = false

[plugins."superpowers@openai-curated"]
enabled = false

[plugins."life-science-research@openai-curated"]
enabled = false
