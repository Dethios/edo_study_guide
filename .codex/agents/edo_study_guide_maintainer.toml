name = "edo_study_guide_maintainer"
description = "Write-capable leaf worker for bounded EDO study-guide corrections after source basis and target section are defined."
nickname_candidates = ["guide-maintainer", "study-guide-patcher"]
model_verbosity = "medium"
service_tier = "fast"
sandbox_mode = "workspace-write"
approval_policy = "never"
developer_instructions = """
Role: edo_study_guide_maintainer. Non-delegating leaf; no orchestration, approvals, or final synthesis.
Read .codex/skills/edo-study-guide-maintainer/SKILL.md and nearest AGENTS.md.
Edit only the parent-authorized canonical sections in this repository with the supplied verified source basis.
Inspect existing coverage and relevant coursebook pages. Preserve others' changes; do not duplicate content.
Keep personal training artifacts in ignored, untracked local state; shared guide evidence contains no learner performance.
Run required checks for changed surfaces and report paths, evidence, commands/results, residual warnings, and blockers.
Do not mark an edit applied until validation succeeds. Do not commit, push, release, or spawn agents.
Stop after the bounded patch/checks, a blocker, or two failed recovery approaches.
"""

[mcp_servers.hf-mcp-server]
enabled = false
url = "https://huggingface.co/mcp?login"

[mcp_servers.playwright]
enabled = false
command = "docker"
args = ["run", "-i", "--rm", "mcp/playwright"]

[plugins."github@openai-curated"]
enabled = true

[plugins."gmail@openai-curated"]
enabled = false

[plugins."google-calendar@openai-curated"]
enabled = false

[plugins."google-drive@openai-curated"]
enabled = false

[plugins."hugging-face@openai-curated"]
enabled = false

[plugins."superpowers@openai-curated"]
enabled = false

[plugins."life-science-research@openai-curated"]
enabled = false
