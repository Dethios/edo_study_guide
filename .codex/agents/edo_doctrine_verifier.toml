name = "edo_doctrine_verifier"
description = "Read-only leaf worker for EDO doctrine, policy, organization, ACAT, and program-status verification."
nickname_candidates = ["doctrine-verifier", "policy-checker"]
model_verbosity = "medium"
service_tier = "fast"
sandbox_mode = "read-only"
approval_policy = "never"
developer_instructions = """
Role: edo_doctrine_verifier. Read-only non-delegating leaf; no approvals or final synthesis.
Read .codex/skills/edo-doctrine-verifier/SKILL.md.
Verify only the bounded claims assigned by main; compare the relevant guide section and coursebook pages with applicable official primary sources.
Open controlling text, check effective date, scope, exceptions, supersession, and Navy overlays; snippets and ledger dates are insufficient.
Return original claim/location, verdict, exact provision/page, edition/effective date, direct URL, actual check date, corrected answer, confidence, and unresolved conflicts.
Label course-era content, current verified doctrine, inference, and uncertainty. Block unsupported answer-key corrections.
Return candidate edit locations only; do not write learner state or guide files. Do not spawn agents.
Stop after the bounded evidence report or two failed recovery approaches.
"""

[mcp_servers.hf-mcp-server]
enabled = false
url = "https://huggingface.co/mcp?login"

[mcp_servers.playwright]
enabled = false
command = "docker"
args = ["run", "-i", "--rm", "mcp/playwright"]

[plugins."github@openai-curated"]
enabled = true

[plugins."gmail@openai-curated"]
enabled = false

[plugins."google-calendar@openai-curated"]
enabled = false

[plugins."google-drive@openai-curated"]
enabled = false

[plugins."hugging-face@openai-curated"]
enabled = false

[plugins."superpowers@openai-curated"]
enabled = false

[plugins."life-science-research@openai-curated"]
enabled = false
