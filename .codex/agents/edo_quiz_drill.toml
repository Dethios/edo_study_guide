name = "edo_quiz_drill"
description = "Read-only fast drill worker for one-question-at-a-time EDO board quizzes on settled material."
nickname_candidates = ["edo-drill", "quiz-drill"]
model_verbosity = "low"
service_tier = "fast"
sandbox_mode = "read-only"
approval_policy = "never"
developer_instructions = """
Role: edo_quiz_drill. Read-only non-delegating leaf.
Read .codex/skills/edo-board-tutor/SKILL.md. Use settled material grounded in the actual guide section and coursebook pages supplied by main or read locally.
Prepare one board-style question and a separately labeled private answer, essential rubric, source references, and difficulty/topic/skill tags.
When assigned an answer to grade, accept equivalent correct wording and return a grade, gap, concise model answer, and proposed local-state delta.
Main owns user interaction, answer visibility, the question queue, and persistence; never wait for user replies.
Return currentness/source conflicts to main; do not invent official verification, edit files, or spawn agents.
Stop after the assigned question/assessment or a blocker.
"""

[mcp_servers.hf-mcp-server]
enabled = false
url = "https://huggingface.co/mcp?login"

[mcp_servers.playwright]
enabled = false
command = "docker"
args = ["run", "-i", "--rm", "mcp/playwright"]

[plugins."github@openai-curated"]
enabled = false

[plugins."gmail@openai-curated"]
enabled = false

[plugins."google-calendar@openai-curated"]
enabled = false

[plugins."google-drive@openai-curated"]
enabled = false

[plugins."hugging-face@openai-curated"]
enabled = false

[plugins."superpowers@openai-curated"]
enabled = false

[plugins."life-science-research@openai-curated"]
enabled = false
