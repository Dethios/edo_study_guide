# EDO coursebook coverage manifest.
# Maintained from local PDFs in tex/assets/coursebook and study-guide source files.
# Update this file when a coursebook module, TLO, chapter mapping, citation key, or coverage status changes.
manifest:
  name: EDO coursebook coverage manifest
  current_as_of: '2026-04-29'
  purpose: Trace coursebook modules and topic learning objectives to study-guide chapters, citation keys, and coverage status to reduce future drift.
  source_root: tex/assets/coursebook
  included_coursebook_chapters:
  - '2'
  - '3'
  - '4'
  - '6'
  excluded_coursebook_chapters:
    '1': 'Excluded per review scope: course introduction and administration.'
    '5': 'Excluded per review scope: not part of the focused technical/acquisition coverage audit.'
  status_values:
    covered: Study guide materially covered the module before the current coursebook audit.
    updated: Coverage existed and was updated or source-aligned during the coursebook audit.
    added: Coverage was added during the coursebook audit.
    partial: Coverage exists but needs additional expansion before it should be treated as complete.
    excluded: Coursebook chapter or module is outside the current review scope.
